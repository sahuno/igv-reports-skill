name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install samtools (for smoke tests)
        run: sudo apt-get update && sudo apt-get install -y samtools

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install igv-reports pyyaml pytest

      - name: Run unit + smoke tests
        env:
          IGV_REPORTS_BIND: ""
        run: bash tests/run_all.sh --no-integration

      - name: Run end-to-end integration (uses committed fixture)
        env:
          IGV_REPORTS_BIND: ""
        run: |
          # end_to_end/scenarios.sh runs the full pipeline (create_report,
          # verify_report, verify_anchors generate + verify, optional
          # --also-png) against tests/fixtures/tiny_colo829.hg38.bam. Takes
          # ~30 s. The --also-png step SKIPs in CI because igver isn't
          # installed (intentional — that path is exercised on hosts that
          # ship the IGVer SIF).
          bash tests/integration/end_to_end/scenarios.sh
